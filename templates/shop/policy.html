{% load static %}
<!doctype html>
<html lang="en-KH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff" />
    <title>{{ title }} — SwayStudio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'shop/store.css' %}" />
  </head>
  <body class="policy-page">
    <header class="checkout-header">
      <a class="wordmark" href="{% url 'shop:home' %}"
        ><span>Sway</span><i aria-hidden="true"></i><b>Studio</b></a
      ><a class="back-link" href="{% url 'shop:home' %}"
        ><span aria-hidden="true">←</span> Back to the shop</a
      >
    </header>
    <main class="policy-content">
      <p class="eyebrow">
        <span class="eyebrow-line"></span> SwayStudio Cambodia
      </p>
      <h1>{{ title|safe }}</h1>
      <p class="policy-copy">{{ body }}</p>
      <p class="policy-updated">Last updated October 2026</p>
      <a class="text-link" href="{% url 'shop:contact' %}"
        >Questions? Contact the studio <span aria-hidden="true">→</span></a
      >
    </main>
    <footer class="checkout-footer">
      <span>© 2026 SwayStudio · Cambodia</span
      ><span>Made for your kind of day.</span>
    </footer>
  </body>
</html>
